[project]
name = "netsdk-core"
version = "0.1.0"
description = "Core building blocks shared by netsdk device packages"
readme = "README.md"
authors = [
    { name = "Mahak", email = "mousamsangwan1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[project.optional-dependencies]
# ntc-templates: default CLI parser engine (D27); pinned so template
# updates only land when we raise the range and the fixtures still pass.
ssh = ["netmiko>=4.5", "ntc-templates>=9.3,<10"]
rest = ["httpx>=0.28"]
# Genie: Cisco's parsers, used per command where ntc-templates falls short
# (D32). genie needs pyats at runtime without declaring it. Pinned like
# ntc-templates; on Python 3.14 one dependency (ruamel.yaml.clib) builds from
# source, so the machine needs gcc and make.
genie = ["genie>=26.10,<27", "pyats>=26.10,<27"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace package: src/netsdk/ has no __init__.py.
module-name = "netsdk.core"
