[project]
name = "netsdk-cisco-ios"
version = "0.1.0"
description = "netsdk SDK for Cisco IOS (classic) devices"
readme = "README.md"
authors = [
    { name = "Mahak", email = "mousamsangwan1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "netsdk-core[ssh,genie]>=0.1,<0.2",
    # Parser engines (D27, D32), declared even though netsdk-core brings them.
    # Genie is a hard dependency: a getter that works only with an extra
    # installed would surprise users.
    "ntc-templates>=9.3,<10",
    "genie>=26.10,<27",
    "pyats>=26.10,<27",
    # Expands IOS abbreviations (Gi1/0/1) to full names (D29).
    "netutils>=1.19,<2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace package: src/netsdk/ and src/netsdk/cisco/ have no __init__.py.
module-name = "netsdk.cisco.ios"

[tool.uv.sources]
netsdk-core = { workspace = true }
